<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Decades Bingo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="bingoplay.css">
  <style>
    /* Modern CSS is included below */
  </style>
</head>
<body class="bg-1970s">
  <div class="header">
    <img src="header.jpg" alt="Decades Bingo Header">
    <h1>Pick Your Game</h1>
  <div id="controls">
  <div id="decade-buttons">
    <button onclick="switchDecade('1970s')">🎵 GAME 1 : <b>1970s</b></button>
    <button onclick="switchDecade('1980s')">📼 GAME 2 : <b>1980s</b></button>
    <button onclick="switchDecade('1990s')">💾 GAME 3 : <b>1990s</b></button>
    <button onclick="switchDecade('2000s')">📱 GAME 4 : <b>2000s</b></button>
  </div>
</div>
  </div>

  <div id="bingo"></div>
  <div id="checksum"></div>
  <div id="win-banner" role="status" aria-live="polite" hidden></div>

  <script src="songs.js"></script>
  <script src="cards.js"></script>
  <script>
    // Phone cards come from the same numbered batch as the printed ones (see cards.js), so the host
    // can check them with "Check a Card". Players open the link the host shares, e.g.
    // index.html?batch=54321. The phone picks a random page from 51 up (four cards, one per decade)
    // and keeps it; &page= picks a specific one. A new batch means a new card and fresh marks.
    const bingoGrid = document.getElementById("bingo");
    const checksumDisplay = document.getElementById("checksum");
    const allDecades = ["1970s", "1980s", "1990s", "2000s"];
    let currentDecade = "1970s";
    let phoneCard = null; // { batch, page }
    let cards = null;     // the page's four cards, in decade order
    let currentCard = null;
    let tileEls = [];     // the 25 squares on screen, row by row
    let shownLines = 0;   // completed lines last time we looked, to celebrate only new ones

    function randomPage() {
      return FIRST_PHONE_PAGE + Math.floor(Math.random() * (LAST_PHONE_PAGE - FIRST_PHONE_PAGE + 1));
    }

    function chooseCard() {
      const params = new URLSearchParams(location.search);
      const urlBatch = Number(params.get("batch"));
      const urlPage = Number(params.get("page"));
      const saved = JSON.parse(localStorage.getItem("bingoPhoneCard"));
      const validBatch = Number.isInteger(urlBatch) && urlBatch > 0;
      const validPage = Number.isInteger(urlPage) && urlPage > 0;

      if (!validBatch) return saved; // no batch in the link: carry on with the saved card, if any

      if (saved && saved.batch === urlBatch && (!validPage || saved.page === urlPage)) return saved;
      const card = { batch: urlBatch, page: validPage ? urlPage : randomPage() };
      clearMarks();
      localStorage.setItem("bingoPhoneCard", JSON.stringify(card));
      return card;
    }

    function getMarks(decade) {
      return (JSON.parse(localStorage.getItem(`bingoState_${decade}`)) || {}).marked || [];
    }

    function updateStorage(decade, song, isMarked) {
      const marked = getMarks(decade).filter(s => s !== song);
      if (isMarked) marked.push(song);
      localStorage.setItem(`bingoState_${decade}`, JSON.stringify({ marked }));
    }

    function clearMarks() {
      allDecades.forEach(decade => localStorage.removeItem(`bingoState_${decade}`));
    }

    function renderCard(card, marked) {
      bingoGrid.innerHTML = "";
      currentCard = card;
      tileEls = [];
      let index = 0;
      for (let row = 0; row < 5; row++) {
        for (let col = 0; col < 5; col++) {
          const i = row * 5 + col;
          const tile = document.createElement("div");
          tile.className = "tile";
          const isBold = (row + col) % 2 === 0;

          if (i === FREE_SQUARE) {
            tile.innerHTML = "<span class='bold'>😎 FREE</span>";
            tile.classList.add("marked");
          } else {
            const song = card.songs[index++];
            tile.innerHTML = isBold ? `<span class='bold'>${song}</span>` : song;
            if (marked.includes(song)) tile.classList.add("marked");
            tile.onclick = () => {
              tile.classList.toggle("marked");
              updateStorage(currentDecade, song, tile.classList.contains("marked"));
              updateWin(true);
            };
          }
          tileEls.push(tile);
          bingoGrid.appendChild(tile);
        }
      }
      checksumDisplay.innerHTML =
        `<strong>Card ${card.number}</strong> · Batch ${phoneCard.batch} · Checksum ${card.checksum}<br>` +
        `<span class="small">Shout BINGO and give the host your card number.</span>`;
    }

    // Highlights any completed line (row, column or diagonal) from the player's own marks and shows a
    // BINGO banner. The host still checks the card against the songs actually played.
    function updateWin(celebrate) {
      const result = checkCard(currentCard, getMarks(currentDecade));
      const winCells = new Set(BINGO_LINES.filter(l => result.lines.includes(l.name)).flatMap(l => l.cells));
      tileEls.forEach((tile, i) => tile.classList.toggle("win", winCells.has(i)));

      const banner = document.getElementById("win-banner");
      if (!result.lines.length) {
        banner.hidden = true;
        banner.classList.remove("pop");
        shownLines = 0;
        return;
      }
      banner.hidden = false;
      banner.innerHTML = result.fullHouse
        ? `<strong>FULL HOUSE!</strong><br>Shout it and give the host card <strong>${currentCard.number}</strong>`
        : `<strong>BINGO!</strong> ${result.lines.join(", ")}<br>Shout it and give the host card <strong>${currentCard.number}</strong>`;
      banner.classList.remove("pop"); // only animate for a newly completed line
      if (celebrate && result.lines.length > shownLines) {
        void banner.offsetWidth; // restart the animation
        banner.classList.add("pop");
        if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
      }
      shownLines = result.lines.length;
    }

    function switchDecade(decade) {
      if (!cards) return;
      currentDecade = decade;
      localStorage.setItem("bingoLastDecade", decade);
      document.body.className = `bg-${decade}`;
      renderCard(cards[allDecades.indexOf(decade)], getMarks(decade));
      shownLines = 0;
      updateWin(false);
    }

    function askForBatch() {
      document.getElementById("controls").hidden = true;
      bingoGrid.className = "ask";
      bingoGrid.innerHTML = `
        <form id="batch-form">
          <p>Enter the batch number your host gave you.</p>
          <input type="number" id="batch-input" min="1" inputmode="numeric" required>
          <button type="submit">Get my card</button>
        </form>`;
      document.getElementById("batch-form").addEventListener("submit", (e) => {
        e.preventDefault();
        location.search = `?batch=${Number(document.getElementById("batch-input").value)}`;
      });
    }

    window.onload = () => {
      phoneCard = chooseCard();
      if (!phoneCard) { askForBatch(); return; }
      history.replaceState(null, "", `?batch=${phoneCard.batch}`);
      cards = cardsForPage(phoneCard.batch, phoneCard.page);
      const last = localStorage.getItem("bingoLastDecade");
      switchDecade(allDecades.includes(last) ? last : "1970s");
    };
  </script>


</body>
</html>
