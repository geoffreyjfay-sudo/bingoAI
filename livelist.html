<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Decades Bingo Song Checklist</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styleslist.css">
</head>
<body>
  <h1>Decades Bingo Song Checklist</h1>
  <p id="service"></p>
  <div class="decade-buttons" id="decadeSelector"></div>
  <div id="counter"></div>
  <button class="action" onclick="nextRandomSong()">Next Random Song</button>
  <button class="action" onclick="undoLastPlayed()">Undo Last Played</button>
  <button class="action" onclick="resetGame()">Start Over</button>

  <section id="card-check">
    <h2>Check a Card</h2>
    <form id="card-check-form">
      <label>Batch <input type="number" id="check-batch" min="1" required></label>
      <label>Card # <input type="number" id="check-card" min="1" required></label>
      <button type="submit">Check</button>
    </form>
    <p class="hint">Batch and card number are under each printed card and on players' phones (phone cards are numbered above 400). Songs are checked against what's been played in that card's game.</p>
    <div id="card-check-result"></div>
  </section>
  <div id="checklist"></div>

  <script src="songs.js"></script>
  <script src="cards.js"></script>
  <script>
    // Which streaming service the song links open: livelist.html (Apple Music) or
    // livelist.html?service=spotify. Both share the same saved game.
    const SERVICES = { apple: "Apple Music", spotify: "Spotify" };
    const service = new URLSearchParams(location.search).get("service") === "spotify" ? "spotify" : "apple";
    const other = service === "apple" ? "spotify" : "apple";
    document.getElementById("service").innerHTML =
      `Links open in <strong>${SERVICES[service]}</strong> · <a href="?service=${other}">switch to ${SERVICES[other]}</a>`;

    const withLinks = name => SONGS[name].map(s => [s.title, s[service]]);
    const decades = BATCH_DECADES.map(d => ({ name: d.name, key: d.key, original: withLinks(d.name) }));

    const checklistContainer = document.getElementById("checklist");
    const counterDisplay = document.getElementById("counter");
    const selectorContainer = document.getElementById("decadeSelector");
    const allSongElements = {};
    let currentDecadeKey = null;

    // Fisher–Yates on a copy: every running order equally likely.
    function shuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function updateStorage(decadeKey, title, isMarked) {
      const key = `bingoState_${decadeKey}`;
      const saved = JSON.parse(localStorage.getItem(key)) || { songs: [], marked: [] };
      if (isMarked) {
        saved.marked = [...new Set([...(saved.marked || []), title])];
      } else {
        saved.marked = (saved.marked || []).filter(t => t !== title);
      }
      localStorage.setItem(key, JSON.stringify(saved));
    }

    function updateCounter() {
      if (!currentDecadeKey) return;
      const marked = document.querySelectorAll(`.decade[data-key="${currentDecadeKey}"] .selected`).length;
      const total = document.querySelectorAll(`.decade[data-key="${currentDecadeKey}"] .song-item`).length;
      counterDisplay.textContent = `Selected ${marked} of ${total} songs`;
    }

    function showPlayed(item, played) {
      item.classList.toggle("selected", played);
      item.querySelector("input").checked = played;
      item.querySelector("a").classList.toggle("disabled-link", played);
    }

    function setPlayed(key, item, played) {
      showPlayed(item, played);
      if (played) item.classList.remove("highlighted");
      updateStorage(key, item.dataset.title, played);
      updateCounter();
    }

    // Un-marks the most recently played song in the decade on screen.
    function undoLastPlayed() {
      if (!currentDecadeKey) return;
      const { marked = [] } = JSON.parse(localStorage.getItem(`bingoState_${currentDecadeKey}`)) || {};
      const last = marked[marked.length - 1];
      if (!last) { alert("Nothing has been played in this game yet."); return; }
      if (!confirm(`Undo "${last}"? It will go back to not played.`)) return;
      const item = allSongElements[currentDecadeKey].find(el => el.dataset.title === last);
      if (item) setPlayed(currentDecadeKey, item, false);
      else updateStorage(currentDecadeKey, last, false);
    }

    // --- Checking a printed card (batch + card number) against the songs played so far ---
    const checkBatch = document.getElementById("check-batch");
    checkBatch.value = localStorage.getItem("bingoBatch") || "";

    document.getElementById("card-check-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const seed = Number(checkBatch.value);
      const number = Number(document.getElementById("check-card").value);
      localStorage.setItem("bingoBatch", seed);
      const out = document.getElementById("card-check-result");
      if (number > LAST_PHONE_PAGE * GAMES) { out.textContent = `There is no card ${number}.`; return; }
      const card = cardByNumber(seed, number);

      const decadeKey = BATCH_DECADES.find(d => d.name === card.decade).key;
      const { marked = [] } = JSON.parse(localStorage.getItem(`bingoState_${decadeKey}`)) || {};
      const result = checkCard(card, marked);

      let verdict;
      if (result.fullHouse) verdict = `<p class="verdict win">FULL HOUSE! Every square has been played.</p>`;
      else if (result.lines.length) verdict = `<p class="verdict win">BINGO! ${result.lines.join(", ")}</p>`;
      else verdict = `<p class="verdict no">Not yet: the closest line still needs ${result.bestMissing} more song${result.bestMissing === 1 ? "" : "s"}.</p>`;

      const cells = result.grid.map(c => c.free
        ? `<td class="free played">FREE</td>`
        : `<td class="${c.played ? "played" : ""}">${c.song}</td>`);
      const rows = [0, 1, 2, 3, 4].map(r => `<tr>${cells.slice(r * 5, r * 5 + 5).join("")}</tr>`).join("");

      out.innerHTML = `
        ${verdict}
        <p>Card ${card.number} (${card.number <= CARDS_PER_BATCH ? "printed" : "phone"}) · Batch ${seed} · <strong>Game ${card.game}: ${card.decade}</strong> · Checksum ${card.checksum}
           — ask the player to read out their checksum to confirm it's the same card.</p>
        <p>${marked.length} song${marked.length === 1 ? "" : "s"} played so far in the ${card.decade} game.</p>
        <table class="check-grid">${rows}</table>`;
    });

    function resetGame() {
      if (!confirm("Start over? This clears the running order and every played song in all eight games.")) return;
      decades.forEach(({ key }) => localStorage.removeItem(`bingoState_${key}`));
      location.reload();
    }

    function renderDecade({ name, key, original }, index) {
      // Save only the running order (titles) and marks; links always come from the loaded list, so
      // the Apple Music and Spotify pages can share a game and link edits show up straight away.
      const linkFor = new Map(original);
      const saved = JSON.parse(localStorage.getItem(`bingoState_${key}`));
      // Older saves stored [title, link] pairs: keep just the titles.
      let order = (saved && saved.songs || []).map(s => Array.isArray(s) ? s[0] : s).filter(t => linkFor.has(t));
      if (!order.length) {
        order = shuffle(original).map(([title]) => title);
      } else {
        order.push(...shuffle(original.filter(([title]) => !order.includes(title))).map(([title]) => title));
      }
      const state = { songs: order, marked: (saved && saved.marked) || [] };
      localStorage.setItem(`bingoState_${key}`, JSON.stringify(state));

      const section = document.createElement("div");
      section.className = "decade";
      section.dataset.key = key;

      const heading = document.createElement("h2");
      heading.textContent = `${name} – Decades Bingo Song Checklist`;
      section.appendChild(heading);

      const grid = document.createElement("div");
      grid.className = "song-grid";

      allSongElements[key] = [];

      state.songs.forEach((title, i) => {
        const link = linkFor.get(title);
        const item = document.createElement("div");
        item.className = "song-item";

        item.dataset.title = title;
        item.innerHTML = `
          <label>
            <input type="checkbox">
            <span>${i + 1}. </span>
            <a href="${link}" target="_blank">${title}</a>
          </label>
        `;

        const checkbox = item.querySelector("input[type='checkbox']");
        const anchor = item.querySelector("a");
        showPlayed(item, state.marked.includes(title));

        // Ticking (or opening the link) marks the song played; unticking asks first, then un-marks it.
        checkbox.addEventListener("change", () => {
          if (checkbox.checked) {
            setPlayed(key, item, true);
          } else if (confirm(`Mark "${title}" as not played?`)) {
            setPlayed(key, item, false);
          } else {
            checkbox.checked = true;
          }
        });
        anchor.addEventListener("click", () => setPlayed(key, item, true));

        grid.appendChild(item);
        allSongElements[key].push(item);
      });

      section.appendChild(grid);
      checklistContainer.appendChild(section);

      const button = document.createElement("button");
      button.textContent = name;
      button.addEventListener("click", () => {
        document.querySelectorAll(".decade").forEach(d => d.classList.remove("active"));
        document.querySelectorAll(".decade-buttons button").forEach(b => b.classList.remove("active"));
        section.classList.add("active");
        button.classList.add("active");
        currentDecadeKey = key;
        updateCounter();
      });

      if (index === 0) {
        section.classList.add("active");
        button.classList.add("active");
        currentDecadeKey = key;
      }

      selectorContainer.appendChild(button);
    }

    function nextRandomSong() {
      if (!currentDecadeKey) return;
      const unselected = allSongElements[currentDecadeKey].filter(el => !el.classList.contains("selected"));
      allSongElements[currentDecadeKey].forEach(el => el.classList.remove("highlighted"));

      if (unselected.length > 0) {
        const next = unselected[Math.floor(Math.random() * unselected.length)];
        next.classList.add("highlighted");
        next.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    }

    // A saved game carries on automatically; "Start Over" begins a new one.
    window.onload = () => {
      decades.forEach(renderDecade);
      updateCounter();
    };
  </script>
</body>
</html>
