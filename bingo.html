<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Geoff & David’s Decades Bingo Bash</title>
  <link rel="stylesheet" href="bingo.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="batch-bar no-print">
  <span id="batch-info"></span>
  <button type="button" id="new-batch">New batch</button>
  <form id="find-card">
    <label>Check card # <input type="number" id="find-card-number" min="1" max="200" required></label>
    <button type="submit">Show</button>
  </form>
  <span id="find-card-result"></span>
</div>
<script src="songs.js"></script>
<script src="cards.js"></script>
<script>
  // Cards are built from a seed so a batch can be reproduced exactly: bingo.html?seed=48213 always
  // gives the same 200 cards, checksums and report. Without ?seed= a new one is picked and added to
  // the URL. The cards themselves come from generateBatch() in cards.js, which livelist.html also
  // uses to check winners.
  const params = new URLSearchParams(location.search);
  let seed = Number(params.get('seed'));
  if (!Number.isInteger(seed) || seed < 1) {
    seed = 10000 + Math.floor(Math.random() * 90000);
    history.replaceState(null, '', `?seed=${seed}`);
  }

  const decades = BATCH_DECADES.map(d => ({ name: d.name, songs: SONGS[d.name].map(s => s.title) }));

  const checksumMap = {};
  const checksumList = [];
  const songUsage = {};
  const cardDetails = {};

  function createCard(card) {
    const grid = [];
    let index = 0;
    for (let row = 0; row < 5; row++) {
      const rowData = [];
      for (let col = 0; col < 5; col++) {
        if (row === 2 && col === 2) {
          rowData.push(`<td class="free">😎<br><span style="color:${card.freeColor}; font-weight:bold;">FREE</span></td>`);
        } else {
          const song = card.songs[index++];
          const isBold = (row + col) % 2 === 0;
          rowData.push(`<td>${isBold ? `<strong>${song}</strong>` : song}</td>`);
          songUsage[song] = (songUsage[song] || 0) + 1;
        }
      }
      grid.push(`<tr>${rowData.join('')}</tr>`);
    }

    (checksumMap[card.checksum] = checksumMap[card.checksum] || []).push(card.number);
    checksumList.push({ card: card.number, checksum: card.checksum });
    cardDetails[card.number] = { decade: card.decade, songs: card.songs };

    return `
    <div class="card ${card.class}" id="card-${card.number}">
<div class="game-label">
  <span style="color: ${card.labelColor};">GAME #${card.game}</span>
  <span style="color: black;"> ${card.decade}</span>
</div>
      <table>${grid.join('')}</table>
      <div class="checksum">CARD ${card.number} · Batch ${seed} · Checksum: ${card.checksum}</div>
    </div>
  `;
  }

  function renderHeader(container) {
    const header = document.createElement('div');
    header.className = 'header';
    const img = new Image();
    img.src = 'header.jpg';
    img.onload = () => {
      img.alt = 'Header Image';
      header.appendChild(img);
      container.prepend(header);
    };
    img.onerror = () => {
      const fallback = document.createElement('h1');
      fallback.textContent = "Rock'n'Roll Bingo";
      header.appendChild(fallback);
      container.prepend(header);
    };
  }

  function renderPage(cardsHTML) {
    const page = document.createElement('div');
    page.className = 'page';
    renderHeader(page);
    page.innerHTML += `<div class="grid">${cardsHTML}</div>`;
    document.body.appendChild(page);
  }

  // Four cards (one per decade) to an A4 page.
  const batch = generateBatch(seed);
  for (let i = 0; i < batch.length; i += 4) {
    renderPage(batch.slice(i, i + 4).map(createCard).join(''));
  }

  const reportPage = document.createElement('div');
  reportPage.className = 'page';
  const report = document.createElement('div');
  report.className = 'report';

  const timestamp = new Date().toLocaleString();
  const duplicates = Object.entries(checksumMap).filter(([_, cards]) => cards.length > 1);

  function renderUsageByDecade() {
    return decades.map(({ name, songs }) => {
      const usageList = songs
        .map(song => ({ song, count: songUsage[song] || 0 }))
        .sort((b, a) => a.count - b.count);
      return `<h3>${name}</h3><ul>` +
        usageList.map(({ song, count }) => `<li>${song}: ${count}</li>`).join('') +
        '</ul>';
    }).join('');
  }

  function renderUnusedSongs() {
    return decades.map(({ name, songs }) => {
      const unused = songs.filter(song => !songUsage[song]);
      if (unused.length === 0) return '';
      return `<h3>${name} — Unused Songs</h3><ul>` +
        unused.sort().map(song => `<li>${song}</li>`).join('') +
        '</ul>';
    }).join('');
  }

  report.innerHTML = `
    <h2>Bingo Card Report</h2>
    <p><strong>Batch:</strong> ${seed} (reprint with bingo.html?seed=${seed})</p>
    <p><strong>Generated:</strong> ${timestamp}</p>
    <p><strong>Total cards:</strong> ${checksumList.length}</p>
    <p><strong>Duplicate Checksums:</strong></p>
    ${duplicates.length === 0 ? '<p>None detected 🎉</p>' :
      '<ul>' + duplicates.map(([checksum, cards]) => {
        return `<li>Checksum ${checksum} appears on cards: ${cards.join(', ')}<br>` +
          cards.map(cardNum => {
            const detail = cardDetails[cardNum];
            return `Card #${cardNum} (${detail.decade}): ${detail.songs.join(', ')}`;
          }).join('<br>') + '</li>';
      }).join('') + '</ul>'}
    <p><strong>Song Usage Count by Decade:</strong></p>
    ${renderUsageByDecade()}
    <p><strong>Unused Songs by Decade:</strong></p>
    ${renderUnusedSongs()}
    <canvas id="checksumChart" width="600" height="300"></canvas>
  `;

  reportPage.appendChild(report);
  document.body.appendChild(reportPage);

  // On-screen tools (hidden when printing).
  document.getElementById('batch-info').innerHTML =
    `<strong>Batch ${seed}</strong> · ${checksumList.length} cards · reopen this page with <code>?seed=${seed}</code> to reprint exactly these cards`;

  document.getElementById('new-batch').addEventListener('click', () => {
    if (confirm(`Make a new batch? Cards from batch ${seed} won't match the new ones — keep this number if you've printed them.`)) {
      location.search = '';
    }
  });

  document.getElementById('find-card').addEventListener('submit', (e) => {
    e.preventDefault();
    const n = Number(document.getElementById('find-card-number').value);
    const result = document.getElementById('find-card-result');
    const card = document.getElementById(`card-${n}`);
    document.querySelectorAll('.card.found').forEach(c => c.classList.remove('found'));
    if (!card) { result.textContent = `No card ${n} in this batch.`; return; }
    const { checksum } = checksumList.find(c => c.card === n);
    result.textContent = `Card ${n}: ${cardDetails[n].decade}, checksum ${checksum}`;
    card.classList.add('found');
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });

  window.onload = () => {
    const ctx = document.getElementById('checksumChart').getContext('2d');
    const topSongs = Object.entries(songUsage)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 10);

    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: topSongs.map(([song]) => song),
        datasets: [{
          label: 'Top Songs in Duplicates',
          data: topSongs.map(([_, count]) => count),
          backgroundColor: '#8b0000'
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { display: false },
          title: {
            display: true,
            text: 'Most Frequently Used Songs'
          }
        },
        scales: {
          x: { title: { display: true, text: 'Song Title' } },
          y: { title: { display: true, text: 'Usage Count' }, beginAtZero: true }
        }
      }
    });
  };
</script>
</body>
</html>
