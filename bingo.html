<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bingo Cards</title>
  <link rel="stylesheet" href="bingo.css">
</head>
<body>
<div class="batch-bar no-print">
  <span id="edition-switch"></span>
  <span id="batch-info"></span>
  <button type="button" id="new-batch">New batch</button>
  <form id="find-card">
    <label>Check card # <input type="number" id="find-card-number" min="1" required></label>
    <button type="submit">Show</button>
  </form>
  <span id="find-card-result"></span>
</div>
<script src="songs.js"></script>
<script src="cards.js"></script>
<script>
  // Cards are built from a seed so a batch can be reproduced exactly: bingo.html?seed=48213 always
  // gives the same cards (400 for Decades, 300 for Christmas), checksums and report. Without ?seed= a new one is picked and added to
  // the URL. The cards themselves come from generateBatch() in cards.js, which livelist.html also
  // uses to check winners.
  const params = new URLSearchParams(location.search);
  let seed = Number(params.get('seed'));
  if (!Number.isInteger(seed) || seed < 1) {
    seed = 10000 + Math.floor(Math.random() * 90000);
    history.replaceState(null, '', editionLink(location.pathname, { seed }));
  }
  document.title = `${EDITION.title}: batch ${seed}`;
  document.getElementById('find-card-number').max = CARDS_PER_BATCH;
  document.getElementById('edition-switch').innerHTML = editionSwitcher('bingo.html');

  const decades = BATCH_DECADES.map(d => ({ name: d.name, songs: SONGS[d.name].map(s => s.title) }));

  const checksumMap = {};
  const checksumList = [];
  const songUsage = {}; // keyed by decade and title: a title can appear in two decades (e.g. "Stay")
  const usageKey = (decade, song) => `${decade}|${song}`;
  const cardDetails = {};

  // Words too long for a square get soft hyphens at sensible places, so they break as "Christmas-
  // time" rather than "Christmastim-e". Only the printed text changes, not the title. Any long word
  // not listed here is left to the browser's own hyphenation (hyphens: auto in bingo.css).
  const BREAKS = {
    Supercalifragilisticexpialidocious: 'Super-cali-fragi-listic-expi-ali-docious',
    Christmastime: 'Christmas-time', Transmission: 'Trans-mission', Thunderbirds: 'Thunder-birds',
    Superstition: 'Super-stition', Sledgehammer: 'Sledge-hammer', Satisfaction: 'Satis-faction',
    Ghostbusters: 'Ghost-busters', Underground: 'Under-ground', Teletubbies: 'Tele-tubbies',
    SquarePants: 'Square-Pants', Radioactive: 'Radio-active', Necessities: 'Neces-sities',
    Independent: 'Inde-pendent', Flintstones: 'Flint-stones', Comfortably: 'Comfort-ably',
    Celebration: 'Cele-bration', Summertime: 'Summer-time', Wonderwall: 'Wonder-wall',
    Watermelon: 'Water-melon', SpongeBob: 'Sponge-Bob',
  };
  function withBreaks(title) {
    return title.replace(/[A-Za-z]{9,}/g, w => BREAKS[w] ? BREAKS[w].replace(/-/g, '&shy;') : w);
  }

  function createCard(card) {
    const grid = [];
    let index = 0;
    for (let row = 0; row < 5; row++) {
      const rowData = [];
      for (let col = 0; col < 5; col++) {
        if (row === 2 && col === 2) {
          rowData.push(`<td class="free">${EDITION.free}<br><span style="color:${card.freeColor}; font-weight:bold;">FREE</span></td>`);
        } else {
          const song = card.songs[index++];
          const isBold = (row + col) % 2 === 0;
          const shown = withBreaks(song);
          rowData.push(`<td>${isBold ? `<strong>${shown}</strong>` : shown}</td>`);
          const key = usageKey(card.decade, song);
          songUsage[key] = (songUsage[key] || 0) + 1;
        }
      }
      grid.push(`<tr>${rowData.join('')}</tr>`);
    }

    (checksumMap[card.checksum] = checksumMap[card.checksum] || []).push(card.number);
    checksumList.push({ card: card.number, checksum: card.checksum });
    cardDetails[card.number] = { decade: card.decade, songs: card.songs };

    return `
    <div class="card ${card.class}" id="card-${card.number}">
<div class="game-label">
  <span style="color: ${card.labelColor};">GAME #${card.game}</span>
  <span style="color: black;"> ${card.decade}</span>
</div>
      <table>${grid.join('')}</table>
      <div class="checksum">CARD ${card.number} · Batch ${seed} · Checksum: ${card.checksum}</div>
    </div>
  `;
  }

  function renderHeader(container) {
    const header = document.createElement('div');
    header.className = 'header';
    const img = new Image();
    img.src = EDITION.header;
    img.onload = () => {
      img.alt = 'Header Image';
      header.appendChild(img);
      container.prepend(header);
    };
    img.onerror = () => {
      const fallback = document.createElement('h1');
      fallback.textContent = EDITION.title;
      header.appendChild(fallback);
      container.prepend(header);
    };
  }

  function renderPage(cards) {
    const page = document.createElement('div');
    page.className = 'page';
    renderHeader(page);
    page.innerHTML += `<div class="grid${cards.length <= 2 ? ' half' : ''}">${cards.join('')}</div>`;
    document.body.appendChild(page);
  }

  // Four cards to an A4 page, each player's set (one card per game) starting on a new sheet: Decades'
  // eight fill two sheets; Christmas' six take one full sheet and half of the next.
  const batch = generateBatch(seed);
  for (let p = 0; p < batch.length; p += GAMES) {
    const player = batch.slice(p, p + GAMES);
    for (let i = 0; i < player.length; i += 4) {
      renderPage(player.slice(i, i + 4).map(createCard));
    }
  }

  const reportPage = document.createElement('div');
  reportPage.className = 'page';
  const report = document.createElement('div');
  report.className = 'report';

  const timestamp = new Date().toLocaleString();
  const duplicates = Object.entries(checksumMap).filter(([_, cards]) => cards.length > 1);

  function renderUsageByDecade() {
    return decades.map(({ name, songs }) => {
      const usageList = songs
        .map(song => ({ song, count: songUsage[usageKey(name, song)] || 0 }))
        .sort((b, a) => a.count - b.count);
      return `<h3>${name}</h3><ul>` +
        usageList.map(({ song, count }) => `<li>${song}: ${count}</li>`).join('') +
        '</ul>';
    }).join('');
  }

  function renderUnusedSongs() {
    return decades.map(({ name, songs }) => {
      const unused = songs.filter(song => !songUsage[usageKey(name, song)]);
      if (unused.length === 0) return '';
      return `<h3>${name} — Unused Songs</h3><ul>` +
        unused.sort().map(song => `<li>${song}</li>`).join('') +
        '</ul>';
    }).join('');
  }

  // Ten most-used songs as plain HTML bars (no chart library, so the page works offline).
  function renderTopSongs() {
    const top = Object.entries(songUsage).sort((a, b) => b[1] - a[1]).slice(0, 10);
    const max = top.length ? top[0][1] : 1;
    return `<h3>Most-Used Songs (cards each appears on)</h3><div class="bars">` +
      top.map(([key, count]) => [...key.split('|'), count]).map(([decade, song, count]) => `
        <div class="bar-row">
          <span class="bar-label">${song} <small>${decade}</small></span>
          <span class="bar"><span style="width:${(count / max * 100).toFixed(1)}%"></span></span>
          <span class="bar-value">${count}</span>
        </div>`).join('') + `</div>`;
  }

  report.innerHTML = `
    <h2>Bingo Card Report</h2>
    <p><strong>${EDITION.title}</strong></p>
    <p><strong>Batch:</strong> ${seed} (reprint with ${editionLink('bingo.html', { seed })}; phone players use ${editionLink('index.html', { batch: seed })})</p>
    <p><strong>Generated:</strong> ${timestamp}</p>
    <p><strong>Total cards:</strong> ${checksumList.length}</p>
    <p><strong>Duplicate Checksums:</strong></p>
    ${duplicates.length === 0 ? '<p>None detected 🎉</p>' :
      '<ul>' + duplicates.map(([checksum, cards]) => {
        return `<li>Checksum ${checksum} appears on cards: ${cards.join(', ')}<br>` +
          cards.map(cardNum => {
            const detail = cardDetails[cardNum];
            return `Card #${cardNum} (${detail.decade}): ${detail.songs.join(', ')}`;
          }).join('<br>') + '</li>';
      }).join('') + '</ul>'}
    <p><strong>Song Usage Count by Game:</strong></p>
    ${renderUsageByDecade()}
    <p><strong>Unused Songs by Game:</strong></p>
    ${renderUnusedSongs()}
    ${renderTopSongs()}
  `;

  reportPage.appendChild(report);
  document.body.appendChild(reportPage);

  // On-screen tools (hidden when printing).
  document.getElementById('batch-info').innerHTML =
    `<strong>Batch ${seed}</strong> · ${checksumList.length} cards · reopen this page with <code>${editionLink('', { seed })}</code> to reprint exactly these cards` +
    ` · phone players: <a href="${editionLink('index.html', { batch: seed })}" target="_blank">${editionLink('index.html', { batch: seed })}</a>`;

  document.getElementById('new-batch').addEventListener('click', () => {
    if (confirm(`Make a new batch? Cards from batch ${seed} won't match the new ones — keep this number if you've printed them.`)) {
      location.href = editionLink(location.pathname);
    }
  });

  document.getElementById('find-card').addEventListener('submit', (e) => {
    e.preventDefault();
    const n = Number(document.getElementById('find-card-number').value);
    const result = document.getElementById('find-card-result');
    const card = document.getElementById(`card-${n}`);
    document.querySelectorAll('.card.found').forEach(c => c.classList.remove('found'));
    if (!card) { result.textContent = `No card ${n} in this batch.`; return; }
    const { checksum } = checksumList.find(c => c.card === n);
    result.textContent = `Card ${n}: ${cardDetails[n].decade}, checksum ${checksum}`;
    card.classList.add('found');
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });

</script>
</body>
</html>
