<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 198" width="900" height="198">
  <!-- Header for the Christmas edition (bingo.html, index.html with ?edition=christmas). System fonts only. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8e0e12"/>
      <stop offset="0.55" stop-color="#b71c1c"/>
      <stop offset="1" stop-color="#1b5e20"/>
    </linearGradient>
    <g id="flake" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.55">
      <line x1="-9" y1="0" x2="9" y2="0"/>
      <line x1="-4.5" y1="-7.8" x2="4.5" y2="7.8"/>
      <line x1="-4.5" y1="7.8" x2="4.5" y2="-7.8"/>
    </g>
  </defs>
  <rect width="900" height="198" rx="14" fill="url(#bg)"/>
  <use href="#flake" x="40" y="34"/>
  <use href="#flake" x="120" y="150" transform="scale(1)"/>
  <use href="#flake" x="210" y="40"/>
  <use href="#flake" x="690" y="30"/>
  <use href="#flake" x="790" y="160"/>
  <use href="#flake" x="860" y="60"/>
  <use href="#flake" x="610" y="170"/>
  <use href="#flake" x="300" y="172"/>
  <g fill="#fff" opacity="0.5">
    <circle cx="80" cy="90" r="2.5"/><circle cx="170" cy="100" r="2"/><circle cx="250" cy="120" r="2.5"/>
    <circle cx="650" cy="110" r="2"/><circle cx="740" cy="90" r="2.5"/><circle cx="830" cy="120" r="2"/>
    <circle cx="560" cy="30" r="2"/><circle cx="350" cy="25" r="2"/>
  </g>
  <!-- snowy ground -->
  <path d="M0 184 Q150 168 300 182 T600 180 T900 178 V198 H0 Z" fill="#fff" opacity="0.9"/>
  <text x="70" y="128" font-size="72" text-anchor="middle">🎄</text>
  <text x="830" y="128" font-size="72" text-anchor="middle">🎅</text>
  <text x="450" y="98" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="58" font-weight="800" fill="#fff" stroke="#5a0a0d" stroke-width="2" paint-order="stroke"
        letter-spacing="1">Family Christmas Bingo</text>
  <text x="450" y="142" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="24" font-weight="600" fill="#ffe082">Christmas · Disney · TV · Movies · Musicals · Party</text>
</svg>
